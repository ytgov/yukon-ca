contact_card:
  label: Contact Card
  description: A two-column contact card with contact details and a place highlight.
  variants:
    default:
      label: Default
      description: Contact details with a highlighted place panel.
  fields:
    instructional_text:
      type: mixed
      label: Instructional text
      description: Text explaining how/when to reach out.
      preview: 'Staff monitor email and phones Monday to Friday between 8:30 am and 4:30 pm.'
    email:
      type: mixed
      label: Email
      description: Rendered email field.
      preview: 'eservices@yukon.ca'
    phone:
      type: mixed
      label: Phone
      description: Rendered phone field.
      preview: '867-332-8573'
    toll_free:
      type: mixed
      label: Phone toll free in the Yukon
      description: Rendered toll free phone field.
      preview: '1-800-667-3494 ext. 3494'
    fax:
      type: mixed
      label: Fax
      description: Rendered fax field.
      preview: 'eservices@yukon.ca'
    mail_address:
      type: mixed
      label: Mail
      description: Rendered mailing address field.
      preview: "Government of Yukon<br>Department of Environment (Mail code)<br>Box 2703<br>Whitehorse, Yukon Y1A 2C6"
    in_person_address:
      type: mixed
      label: In person
      description: Rendered in-person address field.
      preview: ''
    link:
      type: string
      label: Link URL
      description: The URL for the highlighted place link.
      preview: '#'
    place_link:
      type: mixed
      label: Place Node URL
      description: The URL for the highlighted place link.
      preview: '#'
    place_link_text:
      type: mixed
      label: Place link text
      description: The link text for the highlighted place link.
      preview: 'Visit a Department of Environment office'
  libraries:
    -
      contact_card:
        css:
          component:
            dist/css/styles.min.css: { minified: false }
